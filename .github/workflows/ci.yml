name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke test (example profiles)
        run: |
          python -m astromind validate --file profiles/profiles.example.json
          python -m astromind daily --file profiles/profiles.example.json --date 2026-11-09 --no-state --out /tmp/astromind-smoke
