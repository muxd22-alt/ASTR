name: Build Relationship Manuals

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Reference month (YYYY-MM)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: astromind-manuals
  cancel-in-progress: false

jobs:
  manuals:
    runs-on: ubuntu-latest
    env:
      ASTROMIND_PROFILES: ${{ secrets.ASTROMIND_PROFILES }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate profiles
        run: python -m astromind validate

      - name: Build manuals
        shell: bash
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            python -m astromind manuals --month "${{ inputs.month }}"
          else
            python -m astromind manuals
          fi

      - name: Upload manuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astromind-manuals
          path: outputs/manuals/
          if-no-files-found: warn

      - name: Persist manuals (private repos only)
        if: vars.COMMIT_OUTPUTS == 'true'
        run: |
          git config user.name "astromind-bot"
          git config user.email "astromind@users.noreply.github.com"
          git add -f outputs
          git diff --cached --quiet || git commit -m "chore: astromind manuals"
          git push
